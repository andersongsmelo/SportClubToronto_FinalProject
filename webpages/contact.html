<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Sport Club Toronto">
    <title>Sport Club Toronto | Contact Us</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/script.js" defer></script>
</head>
<body class="page-form">

    <nav>
        <a href="../index.html">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="stats.html">Stats</a>
        <a href="contact.html">Contact Us</a>
    </nav>

    <header id="banner">
        <h1>Join the Club / Contact Us</h1>
    </header>

    <main>
        <div class="box form-container">
            <h2>Get in Touch or Register</h2>
            <p>Fill out the form below to register as a member or send us a message.</p>
            
            <div id="error-message"></div>

            <form id="contactForm" novalidate>
                <div class="form-group">
                    <label for="fullName">Full Name:</label>
                    <input type="text" id="fullName" name="fullName">
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email">
                </div>

                <div class="form-group">
                    <label for="interest">Interested In:</label>
                    <select id="interest" name="interest">
                        <option value="">-- Select an option --</option>
                        <option value="player">Tryouts / Player Registration</option>
                        <option value="volunteer">Volunteering</option>
                        <option value="sponsor">Sponsorship</option>
                        <option value="general">General Inquiry</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5"></textarea>
                </div>

                <button type="submit" id="submitBtn">Send Message</button>
            </form>
        </div>

        <aside>
            <p>This website is a student project for Web Programming and Design.</p>
        </aside>
    </main>

    <footer>
        Copyright &copy; 2026 | Sport Club Toronto | Created by Anderson Melo
    </footer>

</body>
</html>
